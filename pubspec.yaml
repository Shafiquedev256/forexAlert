name: forex_alert
description: Price alerts for gold, crypto and major forex pairs that ring until you stop them.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.10.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/default_alarm.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon.png'
  adaptive_icon_background: '#1A56DB'
  adaptive_icon_foreground: 'assets/icon/icon_foreground.png'
  remove_alpha_ios: true
