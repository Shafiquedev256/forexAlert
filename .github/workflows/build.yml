
name: Build Forex Alert

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  APP_NAME: 'Forex Alert'
  APP_ORG: 'com.forexalert'

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate app icon and alarm sound
        run: |
          pip install pillow
          python tools/generate_assets.py

      - name: Create and configure Android project
        run: |
          flutter create --platforms=android --org "$APP_ORG" --project-name forex_alert .
          rm -rf test
          python tools/configure_platforms.py

      - name: Get Flutter dependencies
        run: flutter pub get

      # Android ONLY - do not generate iOS icons in this job.
      - name: Configure Android launcher icons
        run: |
          cat > flutter_launcher_icons_android.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#1A56DB"
            adaptive_icon_foreground: "assets/icon/icon_foreground.png"
          EOF

          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: forex-alert-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate app icon and alarm sound
        run: |
          pip install pillow
          python tools/generate_assets.py

      - name: Create and configure iOS project
        run: |
          flutter create --platforms=ios --org "$APP_ORG" --project-name forex_alert .
          rm -rf test
          python tools/configure_platforms.py

      - name: Get Flutter dependencies
        run: flutter pub get

      # iOS ONLY - Android generation is disabled here.
      - name: Configure iOS launcher icons
        run: |
          cat > flutter_launcher_icons_ios.yaml <<'EOF'
          flutter_launcher_icons:
            android: false
            ios: true
            image_path: "assets/icon/icon.png"
            remove_alpha_ios: true
          EOF

          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Verify iOS icon assets
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          ls -la ios/Runner/Assets.xcassets/AppIcon.appiconset/

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TWELVE_DATA_API_KEY=${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr forex-alert-unsigned.ipa Payload

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: forex-alert-ios-unsigned
          path: forex-alert-unsigned.ipa
